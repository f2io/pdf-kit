name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish (defaults to the branch selected above)'
        required: false
        type: string
      version:
        description: 'Version to publish, e.g. 1.0.0 (defaults to the version in pom.xml)'
        required: false
        type: string
      skip-tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.branch || github.ref }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out ${{ inputs.branch || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Set version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="$VERSION"
          -DprocessAllModules
          -DgenerateBackupPoms=false

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
        run: mvn -B -ntp -DskipTests="$SKIP_TESTS" deploy

      - name: Summary
        run: |
          {
            echo "Published \`$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)\`"
            echo "from branch \`${BRANCH}\` to ${{ github.server_url }}/${{ github.repository }}/packages"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
